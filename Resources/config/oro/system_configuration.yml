# Shared top-level "Aaxis" tab in System Configuration. Feature bundles (Tools, DevTools,
# Ontology, ...) attach their OWN second-level menu group under `aaxis` (aaxis_tools,
# aaxis_devtools, aaxis_ontology) with their pages as third-level children; Oro requires config
# fields at exactly nesting level 5 (tab > menu group > page > fieldset > fields).
system_configuration:
    groups:
        aaxis:
            title: aaxis.common.config.aaxis.title
            icon: fa-cubes

    tree:
        system_configuration:
            aaxis:
                # Below Oro's "System Configuration" tab (255), above Commerce/CRM/Marketing (0),
                # next to app-defined tabs (which conventionally use ~100).
                priority: 99
                children: []
